plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "buildup_situational_crosshair" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('semanticTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.buildup.situationalcrosshair.semantic.SemanticCoreTest'
}
check.dependsOn semanticTest
tasks.register('ruleTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.buildup.situationalcrosshair.rules.RuleEngineTest'
}
check.dependsOn ruleTest
tasks.register('presentationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.buildup.situationalcrosshair.presentation.PresentationTest'
}
check.dependsOn presentationTest
tasks.named('test') {
    // This executable contract suite is run by semanticTest, not a JUnit runner.
    exclude '**/SemanticCoreTest.class'
    exclude '**/RuleEngineTest.class'
    exclude '**/PresentationTest.class'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'buildup_situational_crosshair_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
jar {
    def artifactName = project.name
    from('LICENSE') { rename { "${it}_${artifactName}" } }
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}
