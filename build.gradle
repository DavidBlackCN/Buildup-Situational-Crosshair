plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "buildup_situational_crosshair" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url = 'https://maven.isxander.dev/releases'; content { includeGroup 'dev.isxander' } }
    maven { url = 'https://maven.terraformersmc.com/'; content { includeGroup 'com.terraformersmc' } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Fabric loads YACL's bundled libraries; its Maven-only Kotlin tooling is unnecessary here.
    implementation("dev.isxander:yet-another-config-lib:${project.yacl_version}") { transitive = false }
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'buildup_situational_crosshair_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
jar {
    def artifactName = project.name
    from('LICENSE') { rename { "${it}_${artifactName}" } }
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}

// Deterministic contracts for interrupted transitions and exact Classic endpoints.
tasks.register('animationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.buildup.situationalcrosshair.crosshair.CrosshairTransitionTest'
}
check.dependsOn animationTest
tasks.register('contrastTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.buildup.situationalcrosshair.crosshair.AdaptiveContrastTest'
}
check.dependsOn contrastTest
tasks.named('test') { exclude '**/CrosshairTransitionTest.class', '**/AdaptiveContrastTest.class' }
