name: Build

on:
  push:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - ".gitattributes"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
  pull_request:
    branches: ["*"]
    paths:
      - "src/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - ".gitattributes"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run animation and configuration checks
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Buildup-Situational-Crosshair-Artifacts
          path: build/libs/
